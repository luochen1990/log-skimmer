# ─────────────────────────────────────────────────────────────────────────────
# 薄入口骨架 — org 标准 CI P0 合入门禁 ci-merge (v3.3.1, 2026-10-19; 三档分级
# ci-merge/ci-deploy/ci-periodic 见 lc-studio/forgejo-actions README)
# ─────────────────────────────────────────────────────────────────────────────
# 使用: 复制到目标仓库 .forgejo/workflows/ci-merge.yml, 拷贝 SSOT 的
#   skip-if-passed action 到 .forgejo/actions/skip-if-passed/
#   (tools/check-drift.sh 代劳校验), justfile 实现 `ci-merge` 契约 recipe。
#   只改 ⟦⟧ 标记的 per-repo 字段。
#
# 门禁语义 (v3.0 命名即门禁): ci-merge 红 = 不能合入。P0 档职责 = 确保核心
#   功能的可用性 (fmt/lint/typecheck/核心测试快档, 快步骤先行)。
#
# 分层 (详见 forgejo-actions README):
#   骨架层  本文件 (含内联 checkout 链) — check-drift 结构断言锁死, 人工不改 (除 ⟦⟧ 字段)
#   逻辑层  .forgejo/actions/skip-if-passed — 机器同步分发, 人工不改 (改 SSOT 上游)
#   契约层  justfile 的 `ci-merge` recipe — 各仓库自由实现
#
# [v3.3.1] nix 门禁补 NIX_STATE_DIR 重定向: "零 store 写" 假设修正 — nix 启动期
#   仍会初始化 state dir 写 temproots, ro /nix/var/nix 对 runner 用户不可写,
#   语法正确也被误报红 (secret-guard #337 首爆, 修复经其 PR #343 端到端验证后
#   verbatim 移植); check-drift 锚点 +1 (NIX_STATE_DIR), issue #20。
#
# [v3.3] 新增 Nix syntax gate step: .nix 变更纯解析冒烟 (nixos#1900 — log-skimmer
#   PR 曾在 flake.nix 误写列表闭合 `]);`, ci-merge 全链未拦)。逐文件
#   nix-instantiate --parse, 仅 .nix 有变更时跑; check-drift L2 同步 +3 断言。
#
# [v3.0] 契约整体改名: ci → ci-merge (门禁语义命名; 存量仓库迁移手册见 README)。
#
# [v2.2] review 加固: check-drift 断言扩至 13 条 (just ci 接线 + skip 门禁 4 契约行),
#   gate step 显式 success() 门, action jq null/路径形式防御, pnpm 缓存文档实测校准。
#
# [设计修正记录 v2→v2.1] checkout 曾尝试收进本地 action (checkout-tofu), 首跑实证
#   失败: runner 执行到 uses step 时 workspace 尚未 checkout, 本地 action 文件
#   不可读 ("no files found after reading paths: action.yml" — 鸡生蛋: 官方文档
#   "forget to checkout" NOTE 的深层含义)。故 checkout 链 (SSH setup + TOFU +
#   fetch + key 清理) 回归骨架内联, 由 check-drift.sh 的结构断言防漂移 (弱于哈希
#   对比, 但安全关键行逐条覆盖); skip-if-passed 挪到 checkout 后, 保持本地 action。
#
# ⟦必改⟧ timeout-minutes: 冷/热路径实测预算 + 余量 (硬上限, 超时算 failure 阻塞合并)
# ⟦可选⟧ env: 持久卷缓存重定向 (CARGO_TARGET_DIR / pnpm_config_store_dir / DENO_DIR /
#        VIRTUAL_ENV+POETRY_CACHE_DIR / UV_CACHE_DIR+UV_PROJECT_ENVIRONMENT / npm_config_cache)
# ⟦不改⟧ 其余全部 — 每个字段都有踩坑背书 (见 v1 模板注释)
name: ci-merge

on:
  push:
    # 事件去重: push 仅 master (合并后 commit); feature branch 的 push 由 PR 覆盖
    branches: [master]
  pull_request:
    # 前 3 项为 forgejo 服务端默认事件集 (显式列出); edited 为 WIP 门禁衔接 —
    # 去 WIP 前缀 (PR ready) 时补跑 CI (draft PR 被 job if 跳过, 不订阅 edited
    # 则去 WIP 后拿不到补跑)
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # 手动重试: forgejo UI → Actions → ci-merge → Run workflow

# PR 并发去旧: 同 PR 快速多次 push 取消旧 run (单槽位 runner 不被已 supersede 的
# 旧 run 占位)。push 与 PR 的 ref 不同 (分支 ref vs head ref), 天然不同 group 不互踩。
concurrency:
  group: ci-merge-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: vm-nix
    # 事件去重 (push 仅 master) + WIP 门禁 (draft PR 不烧 CI; 判定用
    # pull_request.draft = forgejo IsWorkInProgress(), 阻塞合并的同一 SSOT;
    # 全 skip 时 run 结论 skipped 非 success, 不污染 skip-if-passed)
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/master') && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    timeout-minutes: 30 # ⟦必改⟧
    # ⟦可选⟧ env: 持久卷缓存 + forgejo 语料拉取凭据 (双源语料: GitHub 语料仓零凭据 +
    #   forgejo 内网实例按固定清单现场拉取 — 隐私红线: 私有实例日志不出内网)
    env:
      CARGO_TARGET_DIR: /var/lib/forgejo-runner/cache/cargo-target
      CORPUS_DIR: /var/lib/forgejo-runner/cache/corpus # 语料仓持久缓存 (幂等 clone 一次后增量 pull, 语料获取流量从 ~10MB/run 降到 ~1MB/周)
      RULES_DIR: /var/lib/forgejo-runner/cache/rules # 规则仓持久缓存 (与 CORPUS_DIR 对称; DNS 瞬态时 fetch-rules.sh pull 失败可降级本地副本, issue #36)
      FORGEJO_API_TOKEN: ${{ secrets.RO_FORGEJO_API_TOKEN }} # secret 名避开 FORGEJO 保留前缀, env 名不变 (fetch-forgejo 零改动)
    steps:
      # ── checkout 链 (骨架内联; 无法 action 化, 见文件头设计修正记录) ──
      # 不用 actions/checkout: 实例 DISABLE_HTTP_GIT=true + SSH 用户名 forgejo +
      # 端口 5522, 官方 action 硬编码不兼容。host key TOFU: 优先 SSH_KNOWN_HOSTS
      # secret 固定 (消除动态 keyscan 的 MITM 窗口, directory-algebra #89); secret
      # 缺失退回动态 keyscan + stderr 警告。服务端 host key 变更须同步轮换该 secret。
      # PR 事件 fetch base+head (支持三点 diff); 其他事件浅克隆 --depth 1 省时。
      - name: Checkout via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "WARN: repo secret SSH_KNOWN_HOSTS 未设置 (TOFU 固定要求), 退回动态 ssh-keyscan (存在 MITM 窗口)." >&2
            ssh-keyscan -p 5522 git.lambda.lc >> ~/.ssh/known_hosts
          fi
          git init
          git remote add origin "ssh://forgejo@git.lambda.lc:5522/${GITHUB_REPOSITORY}.git"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git fetch --no-tags origin "$GITHUB_SHA"
          else
            git fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git checkout "$GITHUB_SHA"

      # 最小权限收尾: 清理 deploy key — runner VM 与缓存卷为 org 各仓库共享 (单槽位
      # 串行), 不清理则本 repo 的只读 key 对其他 repo 的后续 job 可读。
      - name: Cleanup deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      # ── 内容去重 (checkout 后, 本地 action 此时才可读; 编排在骨架, 判定在逻辑层) ──
      # 仅 push 事件查询 (PR close-reopen 同 SHA 场景历史 success 会误跳过 PR 验证);
      # continue-on-error: API 失败退化为不跳过 (fail-open, 不阻断 CI)。
      # 代价: push 事件命中跳过时白做一次 checkout (~1-2s 浅克隆, 可忽略)。
      - name: skip-if-passed
        id: skip
        uses: ./.forgejo/actions/skip-if-passed
        # success() 显式写出隐式默认门 (if 条件不含 status 函数时自动前缀 success() &&),
        # 不依赖读者知晓该规则; 效果: checkout 失败时不进空 workspace 跑探针
        if: success() && github.event_name == 'push'
        continue-on-error: true

      # Nix 语法门禁 — .nix 变更纯解析冒烟 (v3.3, nixos#1900): log-skimmer PR 曾在
      # flake.nix 误写 packages 列表闭合 (`]);`), ci-merge 全链未拦 (vm-nix 契约禁止
      # VM 内求值 flake — ro store), 直到人工本地 nix develop 才炸。本步用
      # nix-instantiate --parse 补口: 纯解析零求值 (abort/throw/import 均不执行)、
      # 零 store 写 (不连 daemon, ro store 契约兼容 — 但 nix 二进制启动仍会初始化
      # state dir 写 temproots GC 记账, ro 的 /nix/var/nix 对 forgejo-runner 用户
      # 不可写 → 经 NIX_STATE_DIR 重定向到 job 私有 tmp, 见 env 注释)、NIX_PATH
      # 无关 (<nixpkgs> 查找路径是求值期语义, 解析期只认字面量 — flake.nix 顶层 {…}
      # 函数/attrset 按普通表达式解析即可, 无需任何求值上下文)。Lix 实现附带
      # parse-time 名字分析: undefined variable 一并拦 (with 动态作用域不误报),
      # 比 CppNix 多一层免费覆盖。清单为空直通, 有失败即红并逐文件点名。
      # (state dir 修正: 2026-10-18 secret-guard PR #337 首次真实执行爆雷 — step
      # 合入后首个含 .nix 变更的 PR, nix 启动即 `creating directory
      # /nix/var/nix/temproots: Permission denied`, 语法正确的文件被误判语法
      # 错误; 修复经 secret-guard PR #343 端到端验证后移植, issue #20。)
      - name: Nix syntax gate
        # success() 同上 (显式默认门); skip 同 SHA 已验证过则本门禁一并跳过
        if: success() && steps.skip.outputs.should_skip != 'true'
        env:
          # PR 事件: base tip sha (事件 payload) — checkout 链已 fetch 其对象, 且
          # deploy key 已清理无法再补 fetch, 只能就地取材做三点 diff
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # nix 启动期 state dir (temproots GC 记账) 重定向: parse 不读 state 内容,
          # 落 /tmp 即可。run_id 后缀隔离跨 run 记账 — run_id 是 per-repo 编号,
          # 共享 runner 下不同 repo 可能撞号同路径, re-run 亦复用同号, 撞号无害
          # (残留 temproots 是惰性垃圾且无 GC 扫此目录)。nix 自动 mkdir, 无需预建。
          NIX_STATE_DIR: /tmp/nix-syntax-state-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # 三点 diff 取本 PR 变更集; --diff-filter 去 D (已删文件无从解析),
            # rename 旧路径由下方 -f 存在性判断兜底
            files="$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${GITHUB_SHA}" -- '*.nix')"
          else
            # 非 PR 事件 (push master / dispatch): checkout 链是 --depth 1 浅克隆,
            # 无 HEAD~1 — 退化为全量 .nix 冒烟 (org 仓 .nix 数量级小, 成本毫秒级)
            files="$(git ls-files -- '*.nix')"
          fi
          if [ -z "$files" ]; then
            echo "无 .nix 变更, 直通"
            exit 0
          fi
          echo "nix 语法门禁: ${files//$'\n'/ }"
          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            # 纯解析: 错误定位 (文件+行列) 由 nix-instantiate 原样打到 stderr
            if ! nix-instantiate --parse "$f" >/dev/null; then
              echo "✗ $f: nix 语法错误"
              status=1
            fi
          done <<< "$files"
          if [ "$status" -eq 0 ]; then echo "✓ nix 语法门禁通过"; fi
          exit "$status"

      # 质量门禁 — 契约层入口, 各仓库 justfile 实现 `ci-merge` recipe:
      # 快步骤先行 (fmt/lint/typecheck 先于慢测试), 阻塞级, 零参数, 失败即红。
      - name: Quality gate (just ci-merge)
        # success() 同上 (显式默认门): checkout 失败时不进空 workspace 跑 just, 避免次级噪音
        if: success() && steps.skip.outputs.should_skip != 'true'
        run: just ci-merge
