# samples: niri-wm/niri/38707882543-116331716854, niri-wm/niri/38707898710-116331769525
# cargo MSRV 解析失败: 锚行指明 rustc 版本不被支持, 后跟 2 空格缩进的
# `pkg@ver requires rustc X` 依赖清单行 (loop), 直至出现 col-0 的处置建议行闭块。
id: cargo-msrv-unsupported
title: cargo MSRV 不满足 (rustc X is not supported by the following package)
tool: cargo
scope: global
category: build
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*error(?:\x1b\[[0-9;]*m)*:(?:\x1b\[[0-9;]*m)* rustc [0-9.]+ is not supported by the following package:'
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?\s{2}\S'
    loop: true
kind: signal
