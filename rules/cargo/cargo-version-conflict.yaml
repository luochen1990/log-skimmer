# samples: niri-wm/niri/35428593659-105858871105, niri-wm/niri/35428349302-105858190910
# cargo 版本/feature 解析冲突树: 锚 `error: failed to select a version for`, 扩展为
# 4 空格缩进的依赖链行 + 特定 col-0 叙述行 (versions that meet/... depends on/help:/
# failed to select) + 空行 (树内分段), 其余内容闭块。
id: cargo-version-conflict
title: cargo 版本/feature 解析冲突树 (failed to select a version for)
tool: cargo
scope: global
category: deps
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*error(?:\x1b\[[0-9;]*m)*:(?:\x1b\[[0-9;]*m)* failed to select a version for '
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(\s{4,}\S.*|versions that meet .*|package .* depends on .*|help: .*|failed to select a version .*)?$'
    loop: true
kind: signal
