# opencode triage agent 崩溃: 红色加粗 `Error: {` 锚 (ANSI 容忍, 行尾 { 限定) +
# 2+ 缩进 JSON 键值行与收尾 } (loop)。JSON 结构锚定, 空行/其他内容闭块。
id: bun-error-json
title: 'bun 进程 JSON 形态未捕获错误 (Error: { ... })'
tool: bun
scope: global
category: unknown
confidence: medium
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*Error: (?:\x1b\[[0-9;]*m)*\{$'
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(\s{2,}\S|\})'
    loop: true
kind: signal
