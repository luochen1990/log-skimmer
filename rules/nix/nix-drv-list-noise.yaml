# samples: lc-studio/nixos/19089-24707, 18114-23732
# nix drv 清单噪音: these N derivations will be built: 锚 + 后续 store path 列表行;
# building '...' 行与 derivation evaluated/checking 回显行同属构建过程噪音。
id: nix-drv-list-noise
title: nix 构建清单与回显噪音
tool: nix
scope: global
kind: noise
patterns:
  - regex: 'these \d+ derivations will be built:'
  - regex: '^\s*(…\s*(\[[0-9hm]\d*s\]\s*)?)?(building ''/nix/store/.+|/nix/store/[a-z0-9]+-\S+|derivation evaluated to /nix/store/.+|checking (derivation|NixOS configuration|flake output).*)$'
    loop: true
