# samples: lc-studio/nixos/19371-24992
# nix option 冲突定义错误: 本仓轮询回显形态为单行强签名 (值树被逐行回显打散,
# 每 host 一行 `✗ host Ns error: ...`), 故取行内锚不设扩展 (相邻块由 A5 合并)。
id: nix-option-conflict
title: nix option 冲突定义错误
tool: nix
scope: global
category: config
confidence: high
patterns:
  - regex: "error: The option `.+['`] has conflicting definition values:"
kind: signal
