# samples: lc-studio/nixos/19089-24707, 19294-24912, 19373-24994 (成功 run 亦有)
# intent: warning 的首个实例 — nix 生态 deprecation/stateVersion 类警告在成功与失败 run
# 均大量出现, 按 spec §1 intent 分层: 成功 job 命中属预期 (不计 FP), 片段仍输出供 agent 参考。
id: nix-deprecation-warning
title: nix 生态 deprecation/配置警告
tool: nix
scope: global
category: config
confidence: medium
intent: warning
patterns:
  - regex: 'warning: (system\.stateVersion is not set|stdenv\.is\w+ is deprecated|''.*'' has been renamed to/replaced by|getExe: Package .+ does not have the meta\.mainProgram|unknown flake output|colliding subpath)'
kind: signal
