# samples: nix-community/home-manager/37227366335-111509727188, nix-community/home-manager/37226440592-111506975547, nix-community/home-manager/37226224086-111506339398
# 现代 nix (>=2.18) 求值错误树: 锚为独立成行的裸 `error:` (git/cargo 的 `error: <msg>` 行内形态
# 不受影响), 扩展为 7+ 空格缩进树行 (… 帧/at 位置/代码 gutter/末帧 error:) 与树内空行 (loop),
# 任意 col-0 非空行 (如 ##[error]) 闭块。来源: nix build --show-trace。
id: nix-eval-error-tree
title: 'nix 求值错误树 (裸 error: 锚 + 7 缩进 trace 帧)'
tool: nix
scope: global
category: config
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?error: ?$'
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(\s{7,}\S.*)?$'
    loop: true
kind: signal
