# samples: lc-studio/nixos/19089-24707, 19294-24912, 18276-23894
# CI 沙箱 unit 失败三连回显: Main process exited / Failed with result / Failed to start
# (systemd journal 转录形态, 编排层信号, 与具体检查工具无关)。
id: systemd-ci-unit-fail
title: CI 沙箱 systemd unit 失败回显
tool: systemd
scope: global
category: config
confidence: high
patterns:
  - regex: '\.service: (Main process exited, code=\w+, status=\d+\S*|Failed with result .+)$'
  - regex: '^\s*…\s*(Failed to start .+|Consumed .+ CPU time over .+)$'
    loop: true
kind: signal
