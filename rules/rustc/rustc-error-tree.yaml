# samples: niri-wm/niri/37721016710-113128410430, niri-wm/niri/35428871875-105859640064, niri-wm/niri/35428989485-105859974298, niri-wm/niri/35550165700-106183274542, niri-wm/niri/37720469238-113126703223
# 锚: rustc 带诊断码的错误头 error[Exxxx]: (容忍 GH 日志时间戳前缀与 ANSI 色码);
# 扩展: 单一结构性 alternation loop (-->/| gutter/行号 gutter/help:/note:/= note/... 省略行),
# 任一行不满足结构即闭块 — 无开放 .* 吞行。
id: rustc-error-tree
title: rustc 编译错误树 (error[Exxxx] 锚 + 位置/gutter/note/help 结构扩展)
tool: rustc
scope: global
category: typecheck
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(?:\x1b\[[0-9;]*m)*error\[E[0-9]{4}\](?:\x1b\[[0-9;]*m)*: '
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?(\s*(?:\x1b\[[0-9;]*m)*--> |\s*(?:\x1b\[[0-9;]*m)*\||\s*(?:\x1b\[[0-9;]*m)*\s*[0-9]+(?:\x1b\[[0-9;]*m)* +(?:\x1b\[[0-9;]*m)*\||\s*(?:\x1b\[[0-9;]*m)*(help|note)(?:\x1b\[[0-9;]*m)*: |\s*(?:\x1b\[[0-9;]*m)*= |(?:\x1b\[[0-9;]*m)*\.\.\.$)'
    loop: true
kind: signal
