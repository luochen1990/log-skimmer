# samples: sst/opencode/38847754130-116802135105
# playwright 断言失败详情块: 4 空格缩进 `Error: ...` 锚。Locator/Expected/Received/Timeout
# 与 Call log 之间隔空行, 状态机不跨空行 — 用 context.after=6 带出期望/实际值 (仅扩输出)。
id: playwright-assert-failed
title: 'playwright 断言失败 (4 缩进 Error: 详情块)'
tool: playwright
scope: global
category: test
confidence: high
context: {before: 0, after: 6}
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?\s{4}Error: '
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?\s{4,}\S'
    loop: true
kind: signal
