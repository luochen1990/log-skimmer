# samples: lc-studio/nixos/19371-24992, 19089-24707
# just recipe 失败双形态: exit code (error: recipe `x` failed ... with exit code N)
# 与 signal 终止 (... by signal N)。行内匹配 (容忍轮询回显/时间戳前缀)。
id: just-recipe-fail
title: 'just recipe 失败 (exit code / signal)'
tool: just
scope: global
category: build
confidence: high
patterns:
  - regex: 'error: recipe `.+` (failed on line \d+ with exit code \d+|was terminated on line \d+ by signal \d+)'
kind: signal
