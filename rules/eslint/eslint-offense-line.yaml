# samples: sst/opencode/38847484611-116801198128
# eslint 改动文件检查输出 (bun run lint:changed): `<path>:<line>:<col>  <rule>  <message>`
# 双空格分隔的紧凑单行形态; 路径需带 JS/TS 扩展名 + 行:列, 双端结构锚定。
# 相邻违规行由输出层 A5 合并为一块。注: 样本为 opencode 自定义 formatter, 无 severity 字段。
id: eslint-offense-line
title: eslint 违规行 (path:line:col  rule  message 紧凑格式)
tool: eslint
scope: global
category: lint
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?\S+\.(ts|tsx|js|jsx|mjs|cjs|mts|cts):[0-9]+:[0-9]+  \S+  \S'
kind: signal
