# samples: niri-wm/niri/37725735250-113143344875
# Rust 运行时 panic 头 (thread '<name>' (id)? panicked at <loc>:)。消息行无统一结构,
# 不用扩展吞行 — 单行块 + context.after=2 带出 panic 消息行与 note 行 (仅扩输出, 不扩状态机)。
id: rust-test-panic
title: Rust 运行时 panic (thread panicked at)
tool: rust
scope: global
category: test
confidence: high
context: {before: 0, after: 2}
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?thread ''[^'']+''( \([0-9]+\))? panicked at '
kind: signal
