# GitHub Actions runner 错误注解 (##[error]...) — 工具无关的失败标记安全网:
# 覆盖 workflow 级错误 (action 解析失败/超时/label 缺失) 等无具体工具输出的失败形态。
id: github-actions-error-annotation
title: GH Actions 错误注解行 (##[error] 失败标记安全网)
tool: github-actions
scope: global
category: unknown
confidence: high
patterns:
  - regex: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?##\[error\]'
kind: signal
