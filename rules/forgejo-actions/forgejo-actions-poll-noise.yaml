# samples: lc-studio/nixos/19089-24707, 19294-24912
# CI 轮询回显噪音: 进度占位/静默提示/槽位等待重试 — 海量且零信息量。
id: forgejo-actions-poll-noise
title: Forgejo CI 轮询回显噪音
tool: forgejo-actions
scope: global
kind: noise
patterns:
  - regex: '^\s*…?\s*(\[[0-9hm]\d*s\]\s*)?(… \(更多日志下次显示\)|<静默中…>|\[p1\] P1 槽位忙.*)$'
    loop: true
