[package]
# 职责: Log Skimmer POC 引擎 — 规则加载 + 逐行状态机 + fragment 输出 + L0 统计 (契约: ../docs/rule-format.md)
name = "log-skimmer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
clap = { version = "4", features = ["derive"] }

